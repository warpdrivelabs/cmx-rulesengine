<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#1c2530" flood-opacity="0.11"/></filter><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a6ed1"/><stop offset="1" stop-color="#00a99a"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8e8f8"/><stop offset="1" stop-color="#d6f1ef"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#ffffff"/><path d="M26 0 L0 0 0 26" fill="none" stroke="#f0f6fc" stroke-width="1"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#5a6b7b"/></marker><marker id="arrb" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#0a6ed1"/></marker><marker id="arrg" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#178a5a"/></marker><marker id="arrp" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#7c5cff"/></marker><marker id="arrt" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#00a99a"/></marker><marker id="arrr" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#d1394a"/></marker><marker id="arra" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#c26a00"/></marker><marker id="arrf" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#8b97b3"/></marker><marker id="arri" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#1c2530"/></marker></defs><rect width="980" height="560" fill="#ffffff"/><rect width="980" height="560" fill="url(#grid)"/><rect x="28" y="27" width="4" height="17" rx="2" fill="url(#hd)"/><text x="39" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c2530" text-anchor="start">决策图 · JDM（JSON Decision Model）拓扑编排</text><text x="39" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8b97b3" text-anchor="start">数据自 Input 左→右流至 Output；Kahn 拓扑排序，逐节点累积上下文合并</text><text x="70" y="78" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#8b97b3" text-anchor="start">6 类节点：</text><rect x="150" y="66" width="12" height="12" rx="3" fill="#acb5bd" stroke="#5a6b7b"/><text x="168" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">输入</text><rect x="285" y="66" width="12" height="12" rx="3" fill="#8bc4ac" stroke="#178a5a"/><text x="303" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">决策表</text><rect x="420" y="66" width="12" height="12" rx="3" fill="#84b6e8" stroke="#0a6ed1"/><text x="438" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">表达式映射</text><rect x="555" y="66" width="12" height="12" rx="3" fill="#e0b480" stroke="#c26a00"/><text x="573" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">脚本</text><rect x="690" y="66" width="12" height="12" rx="3" fill="#beaeff" stroke="#7c5cff"/><text x="708" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">子决策</text><rect x="825" y="66" width="12" height="12" rx="3" fill="#80d4cc" stroke="#00a99a"/><text x="843" y="76" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.8" font-weight="500" fill="#1c2530" text-anchor="start">输出</text><path d="M230,272 C255.0,272 255.0,182 280,182" fill="none" stroke="#5a6b7b" stroke-width="1.9" marker-end="url(#arr)"/><path d="M230,272 C255.0,272 255.0,362 280,362" fill="none" stroke="#5a6b7b" stroke-width="1.9" marker-end="url(#arr)"/><path d="M470,182 C495.0,182 495.0,182 520,182" fill="none" stroke="#178a5a" stroke-width="1.9" marker-end="url(#arrg)"/><path d="M470,362 C495.0,362 495.0,362 520,362" fill="none" stroke="#0a6ed1" stroke-width="1.9" marker-end="url(#arrb)"/><path d="M710,182 C735.0,182 735.0,260 760,260" fill="none" stroke="#c26a00" stroke-width="1.9" marker-end="url(#arra)"/><path d="M710,362 C735.0,362 735.0,284 760,284" fill="none" stroke="#7c5cff" stroke-width="1.9" marker-end="url(#arrp)"/><rect x="80" y="240" width="150" height="64" rx="11" fill="#f5f6f7" stroke="#acb5bd" stroke-width="1.2" filter="url(#sh)"/><rect x="80" y="240" width="4.5" height="64" rx="2" fill="#5a6b7b"/><text x="96" y="264" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">Input</text><text x="96" y="283" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">输入事实 facts</text><rect x="280" y="150" width="190" height="64" rx="11" fill="#f1f8f5" stroke="#8bc4ac" stroke-width="1.2" filter="url(#sh)"/><rect x="280" y="150" width="4.5" height="64" rx="2" fill="#178a5a"/><text x="296" y="174" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">决策表 · 资格</text><text x="296" y="193" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">score→level</text><rect x="280" y="330" width="190" height="64" rx="11" fill="#f0f6fc" stroke="#84b6e8" stroke-width="1.2" filter="url(#sh)"/><rect x="280" y="330" width="4.5" height="64" rx="2" fill="#0a6ed1"/><text x="296" y="354" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">表达式 · 额度</text><text x="296" y="373" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">income*rate→limit</text><rect x="520" y="150" width="190" height="64" rx="11" fill="#fbf6f0" stroke="#e0b480" stroke-width="1.2" filter="url(#sh)"/><rect x="520" y="150" width="4.5" height="64" rx="2" fill="#c26a00"/><text x="536" y="174" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">脚本 · 阶梯税</text><text x="536" y="193" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">Rhai 累进计算</text><rect x="520" y="330" width="190" height="64" rx="11" fill="#f7f5ff" stroke="#beaeff" stroke-width="1.2" filter="url(#sh)"/><rect x="520" y="330" width="4.5" height="64" rx="2" fill="#7c5cff"/><text x="536" y="354" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">子决策 · 风控</text><text x="536" y="373" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">按组织路由</text><rect x="760" y="240" width="150" height="64" rx="11" fill="#f0faf9" stroke="#80d4cc" stroke-width="1.2" filter="url(#sh)"/><rect x="760" y="240" width="4.5" height="64" rx="2" fill="#00a99a"/><text x="776" y="264" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">Output</text><text x="776" y="283" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">决策输出</text><rect x="70" y="430" width="840" height="54" rx="11" fill="#f7f5ff" stroke="#beaeff" stroke-width="1.2" filter="url(#sh)"/><rect x="70" y="430" width="4.5" height="54" rx="2" fill="#7c5cff"/><text x="86" y="454" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">Kahn 拓扑求值</text><text x="86" y="473" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">拓扑序逐节点：读累积上下文 → 求值 → 输出 merge 回上下文 → 传递后继；成环在求值期报错并落 trace</text><rect x="70" y="500" width="840" height="44" rx="11" fill="#f5f6f7" stroke="#acb5bd" stroke-width="1.2" filter="url(#sh)"/><rect x="70" y="500" width="4.5" height="44" rx="2" fill="#5a6b7b"/><text x="86" y="524" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#1c2530" text-anchor="start">子决策路由（SubflowRouter 式）</text><text x="86" y="543" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">decision 节点按主决策维度（org/字典）BFS 预载解析器 → 递归求值，深度上限防失控</text></svg>