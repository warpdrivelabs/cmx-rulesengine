ce" font-size="13" font-weight="800" fill="#0a6ed1" text-anchor="middle">A</text><text x="324" y="134.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">Any 任意 · 多命中须同值</text><rect x="512" y="108" width="224" height="44" rx="9" fill="#f3f8fd" stroke="#a9ccef" stroke-width="1.2"/><rect x="520" y="116" width="30" height="28" rx="6" fill="#d8e8f8" stroke="#9dc5ed"/><text x="535" y="135.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#0a6ed1" text-anchor="middle">P</text><text x="558" y="134.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">Priority · 按值优先取一</text><rect x="746" y="108" width="224" height="44" rx="9" fill="#f3f8fd" stroke="#a9ccef" stroke-width="1.2"/><rect x="754" y="116" width="30" height="28" rx="6" fill="#d8e8f8" stroke="#9dc5ed"/><text x="769" y="135.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#0a6ed1" text-anchor="middle">F</text><text x="792" y="134.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">First · 按行序取首命中</text><rect x="28" y="175" width="6" height="22" rx="3" fill="#7c5cff"/><text x="44" y="190" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#7c5cff" text-anchor="start">多命中（返回数组）</text><rect x="44" y="207" width="224" height="44" rx="9" fill="#f8f7ff" stroke="#d1c6ff" stroke-width="1.2"/><rect x="52" y="215" width="30" height="28" rx="6" fill="#eae5ff" stroke="#cbbeff"/><text x="67" y="234.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#7c5cff" text-anchor="middle">C</text><text x="90" y="233.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">Collect 收集——所有命中输出成列表</text><rect x="278" y="207" width="224" height="44" rx="9" fill="#f8f7ff" stroke="#d1c6ff" stroke-width="1.2"/><rect x="286" y="215" width="30" height="28" rx="6" fill="#eae5ff" stroke="#cbbeff"/><text x="301" y="234.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#7c5cff" text-anchor="middle">R</text><text x="324" y="233.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">RuleOrder 规则序——按行序收集</text><rect x="512" y="207" width="224" height="44" rx="9" fill="#f8f7ff" stroke="#d1c6ff" stroke-width="1.2"/><rect x="520" y="215" width="30" height="28" rx="6" fill="#eae5ff" stroke="#cbbeff"/><text x="535" y="234.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#7c5cff" text-anchor="middle">O</text><text x="558" y="233.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">OutputOrder 输出序——按输出优先序收集</text><rect x="28" y="274" width="6" height="22" rx="3" fill="#178a5a"/><text x="44" y="289" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#178a5a" text-anchor="start">聚合（Collect 变体，返回单值）</text><rect x="44" y="306" width="224" height="44" rx="9" fill="#f3f9f7" stroke="#aed6c5" stroke-width="1.2"/><rect x="52" y="314" width="30" height="28" rx="6" fill="#daece5" stroke="#a2d0bd"/><text x="67" y="333.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#178a5a" text-anchor="middle">C+</text><text x="90" y="332.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">CollectSum 求和</text><rect x="278" y="306" width="224" height="44" rx="9" fill="#f3f9f7" stroke="#aed6c5" stroke-width="1.2"/><rect x="286" y="314" width="30" height="28" rx="6" fill="#daece5" stroke="#a2d0bd"/><text x="301" y="333.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#178a5a" text-anchor="middle">C&lt;</text><text x="324" y="332.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">CollectMin 最小</text><rect x="512" y="306" width="224" height="44" rx="9" fill="#f3f9f7" stroke="#aed6c5" stroke-width="1.2"/><rect x="520" y="314" width="30" height="28" rx="6" fill="#daece5" stroke="#a2d0bd"/><text x="535" y="333.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#178a5a" text-anchor="middle">C&gt;</text><text x="558" y="332.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">CollectMax 最大</text><rect x="746" y="306" width="224" height="44" rx="9" fill="#f3f9f7" stroke="#aed6c5" stroke-width="1.2"/><rect x="754" y="314" width="30" height="28" rx="6" fill="#daece5" stroke="#a2d0bd"/><text x="769" y="333.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#178a5a" text-anchor="middle">C#</text><text x="792" y="332.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.6" font-weight="500" fill="#1c2530" text-anchor="start">CollectCount 计数</text></svg>