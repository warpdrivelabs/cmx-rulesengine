</marker><marker id="arrf" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#8b97b3"/></marker><marker id="arri" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#1c2530"/></marker></defs><rect width="980" height="500" fill="#ffffff"/><rect width="980" height="500" fill="url(#grid)"/><rect x="28" y="27" width="4" height="17" rx="2" fill="url(#hd)"/><text x="39" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c2530" text-anchor="start">完整性分析 · gap（空隙）/ overlap（重叠）</text><text x="39" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8b97b3" text-anchor="start">超越 ZEN 的世界级能力：区域推理，非逐点穷举——ZEN/多数引擎缺此</text><text x="70" y="96" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#5a6b7b" text-anchor="start">决策表某输入列 score 的规则区间（判定侧 FEEL）：</text><line x1="110" y1="214" x2="860" y2="214" stroke="#5a6b7b" stroke-width="2"/><line x1="110.0" y1="208" x2="110.0" y2="220" stroke="#5a6b7b" stroke-width="1.6"/><text x="110.0" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#8b97b3" text-anchor="middle">0</text><line x1="560.0" y1="208" x2="560.0" y2="220" stroke="#5a6b7b" stroke-width="1.6"/><text x="560.0" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#8b97b3" text-anchor="middle">600</text><line x1="635.0" y1="208" x2="635.0" y2="220" stroke="#5a6b7b" stroke-width="1.6"/><text x="635.0" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#8b97b3" text-anchor="middle">700</text><line x1="860.0" y1="208" x2="860.0" y2="220" stroke="#5a6b7b" stroke-width="1.6"/><text x="860.0" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#8b97b3" text-anchor="middle">1000</text><rect x="635.0" y="162" width="225.0" height="20" rx="6" fill="#d1e8de" stroke="#8bc4ac" stroke-width="1.2"/><text x="747.5" y="176" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#3a9c73" text-anchor="middle">规则1 [700..1000]</text><rect x="560.0" y="162" width="75.0" height="20" rx="6" fill="#cee2f6" stroke="#84b6e8" stroke-width="1.2"/><text x="597.5" y="176" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#2f84d8" text-anchor="middle">规则2 [600..700)</text><rect x="597.5" y="130" width="112.5" height="20" rx="6" fill="#e5deff" stroke="#beaeff" stroke-width="1.2"/><text x="653.75" y="144" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#9074ff" text-anchor="middle">规则3 [650..800]</text><rect x="110.0" y="162" width="450.0" height="72" rx="6" fill="#fbeff1" stroke="#e89ca4" stroke-width="1.2" stroke-dasharray="5 3"/><text x="335.0" y="150" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#d1394a" text-anchor="middle">GAP 空隙 [0..600)</text><text x="335.0" y="190" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="500" fill="#d1394a" text-anchor="middle">未被任何规则覆盖</text><rect x="635.0" y="122" width="75.0" height="8" rx="3" fill="#c26a00" stroke="#d5dce5" stroke-width="1.2"/><text x="672.5" y="114" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#c26a00" text-anchor="middle">OVERLAP 重叠</text><rect x="70" y="294" width="420" height="120" rx="11" fill="#fbf6f0" stroke="#e0b480" stroke-width="1.2" filter="url(#sh)"/><rect x="70" y="294" width="4.5" height="120" rx="2" fill="#c26a00"/><text x="86" y="318" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="start">overlap · 区域相交推理</text><text x="86" y="337" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">Constraint::intersects 对每对规则逐列判相交</text><text x="86" y="353.5" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">含 not()/!= 的列判「未知」→ 不误报</text><text x="86" y="370.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">U/A/P 等单命中策略下重叠即潜在冲突</text><rect x="510" y="294" width="400" height="120" rx="11" fill="#fcf3f4" stroke="#e89ca4" stroke-width="1.2" filter="url(#sh)"/><rect x="510" y="294" width="4.5" height="120" rx="2" fill="#d1394a"/><text x="526" y="318" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="start">gap · 分段笛卡尔积 + 真实求值</text><text x="526" y="337" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">每列按边界切分 → 取代表点</text><text x="526" y="353.5" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">笛卡尔积（里程表编码）遍历组合</text><text x="526" y="370.0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">逐组合过真实 any_rule_matches 查覆盖</text><text x="70" y="436" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#5a6b7b" text-anchor="start">注：脚本决策为黑盒，analyze 显式返回「不参与完整性分析」（非静默假 complete）——诚实披露。</text></svg>