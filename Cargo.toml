# cmx-rulesengine —— 独立规则引擎微服务（对标 GoRules ZEN / DMN，参照 cmx-flowengine S0 骨架）。
#
# 方案见 docs/cmx-rulesengine-design.md。本 workspace 承载与平台/框架解耦的**决策规则引擎**全部
# crate（model/feel/engine/def/store-pg，R2 加 dmn/adapters）+ 独立可跑 bin（cmx-rule-server）。
# 平台适配层 cmx-rule-api 将留在 cmx-container（keep-wired，经跨 workspace 路径引本库 cmx-rule-app）。
#
# 依赖策略（与 cmx-flowengine 逐一对齐）：域内 rule crate 纯 path；基础设施（cmx-database-pg /
# cmx-core / cmx-web-chassis / cmx-web-monitor / cmx-service-base）以 path 复用 cmx-container 的成员
# crate（它们仍属 cmx-container workspace，对其根解析 workspace=true 与 [patch.nora]，故本库无需
# nora 私仓、无需把 infra 纳入 members）；外部 crate 走 aliyun 镜像（见 .cargo/config.toml），版本与
# cmx-container 根对齐以便 Cargo 合一。
[workspace]
resolver = "2"
# members 随实现进度增量加入（离线环境下 cargo 会解析全 workspace，未实现的 crate 会阻断解析）。
# R0 已实现：内核三 crate。def/store-pg/app/server 待其 Cargo.toml 落地后再取消注释。
members = [
    "crates/cmx-rule-model",
    "crates/cmx-rule-feel",
    "crates/cmx-rule-engine",
    "crates/cmx-rule-store-pg",
    "crates/cmx-rule-app",
    "crates/cmx-rule-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["skylake@pansoft.com"]

[workspace.dependencies]
# —— 域内 rule crate（纯 path，不经私仓）——
cmx-rule-model = { path = "crates/cmx-rule-model", version = "0.1.0" }
cmx-rule-feel = { path = "crates/cmx-rule-feel", version = "0.1.0" }
cmx-rule-engine = { path = "crates/cmx-rule-engine", version = "0.1.0" }
cmx-rule-def = { path = "crates/cmx-rule-def", version = "0.1.0" }
cmx-rule-store-pg = { path = "crates/cmx-rule-store-pg", version = "0.1.0" }
cmx-rule-app = { path = "crates/cmx-rule-app", version = "0.1.0" }

# —— 复用 cmx-container 基础设施（跨 workspace 路径；仍是 cmx-container 成员，非本库成员）——
cmx-database-pg = { path = "../cmx-container/crates/libs/cmx-infra/cmx-database-pg", version = "0.1.12" }
cmx-core = { path = "../cmx-container/crates/libs/cmx-core", version = "0.1.12" }
cmx-web-chassis = { path = "../cmx-container/crates/libs/cmx-web-chassis", version = "0.1.12" }
cmx-web-monitor = { path = "../cmx-container/crates/libs/cmx-web-monitor", version = "0.1.12" }
cmx-service-base = { path = "../cmx-container/crates/libs/cmx-service-base", version = "0.1.12", default-features = false }
# 配置中台（ConfigManager）：rule-app 页面资产目录（assets_ui_*）/auth 段等业务配置直读
cmx-utils = { path = "../cmx-container/crates/libs/cmx-utils", version = "0.1.12" }
# 页面只读投递（native/html-pages 六端点通用路由，收编原 rule-app native_pages.rs）
cmx-form = { path = "../cmx-container/crates/libs/cmx-form", version = "0.1.12" }
# 引擎应用层横切件单源（tenant 上下文 / dbid 路由 / 两族 auth 中间件 / resp 别名——收编本仓 tenant.rs 等同源副本）
cmx-engine-kit = { path = "../cmx-container/crates/libs/cmx-engine-kit", version = "0.1.12" }

# —— 外部 crate（版本照抄 cmx-container 根 [workspace.dependencies]，与 flow 对齐）——
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1.0"
# 非加密内容哈希（release rev = xxhash64→16hex，字节对齐门户 cmx-jsonstore::content_rev）
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# JWT 验签（R3 认证：验 HS256/RS256 签名，解 tenant/user/roles claim）
jsonwebtoken = "9"
# SSE 事件流（R4）：broadcast → axum Sse 的流适配
tokio-stream = { version = "0.1", features = ["sync"] }
# OpenAPI（R4 headless 契约）
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
# DMN XML 解析（R2）
roxmltree = "0.20"
# 脚本能力（SC0）：过程式逃生舱。sync=Send+Sync 契合引擎；serde=Dynamic↔serde_json::Value 桥接。
# rhai-1.20.0 已离线缓存；Don't-Panic 保证 + 原生沙箱（max_operations/call_levels/超时钩子）。
rhai = { version = "1.20", features = ["serde", "sync"] }
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-full", "timeout", "limit"] }
# 自动读取 .env（与门户 / flow 一致：bin 自读 .env 无需手动 source）
dotenvy = "0.15"

# 开发 profile：debug = 1 仅保留行号表（backtrace 仍有文件名+行号可定位），裁掉默认的全量
# DWARF（debug = 2）——链接更快、target 体积大幅缩小。需要调试器检视变量（gdb/lldb print
# 结构体字段）时临时改回 debug = 2 重编译即可；其余项保持 Cargo dev 默认，不显式覆盖。
[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"

[profile.test]
# 显式继承 dev，让 cargo test 也用上 dev 里自定义的 debug = 1
# 不写这行的话，test 只继承 dev 的内置默认值，而不是你在 [profile.dev] 里覆盖后的值
inherits = "dev"
