</marker><marker id="arrf" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#8b97b3"/></marker><marker id="arri" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#1c2530"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect width="940" height="440" fill="url(#grid)"/><rect x="28" y="27" width="4" height="17" rx="2" fill="url(#hd)"/><text x="39" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c2530" text-anchor="start">多租户 · db-per-tenant 物理隔离（R3）</text><text x="39" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8b97b3" text-anchor="start">single 单库零回归；multi 派生 rule_&lt;tenant&gt; 库，懒备库</text><rect x="60" y="110" width="250" height="74" rx="11" fill="#f0f6fc" stroke="#84b6e8" stroke-width="1.2" filter="url(#sh)"/><rect x="60" y="110" width="4.5" height="74" rx="2" fill="#0a6ed1"/><text x="76" y="134" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="start">请求 + 租户身份</text><text x="76" y="153" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">JWT claim / X-Tenant 头</text><text x="76" y="169.5" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">current_tenant()</text><rect x="370" y="110" width="220" height="74" rx="11" fill="#f7f5ff" stroke="#beaeff" stroke-width="1.2" filter="url(#sh)"/><rect x="370" y="110" width="4.5" height="74" rx="2" fill="#7c5cff"/><text x="386" y="134" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="start">tenancy.rs 派生</text><text x="386" y="153" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">single→RULE_DB_ID</text><text x="386" y="169.5" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">multi→rule_&lt;tenant&gt;（小写）</text><path d="M310,147 L370,147" fill="none" stroke="#0a6ed1" stroke-width="1.9" marker-end="url(#arrb)"/><path d="M660,96 h180 v46 a90,10 0 0 1 -180,0 v-46 a90,10 0 0 1 180,0" fill="#f2f3f4" stroke="#acb5bd" stroke-width="1.3"/><ellipse cx="750" cy="96" rx="90" ry="10" fill="#e8eaed" stroke="#acb5bd"/><text x="750" y="126" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#73818f" text-anchor="middle">rule_pg（single 默认）</text><path d="M590,147 L654,118" fill="none" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M660,176 h180 v46 a90,10 0 0 1 -180,0 v-46 a90,10 0 0 1 180,0" fill="#ecf6f2" stroke="#8bc4ac" stroke-width="1.3"/><ellipse cx="750" cy="176" rx="90" ry="10" fill="#dfefe8" stroke="#8bc4ac"/><text x="750" y="206" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#3a9c73" text-anchor="middle">rule_acme</text><path d="M590,147 L654,198" fill="none" stroke="#178a5a" stroke-width="1.6" marker-end="url(#arrg)"/><path d="M660,256 h180 v46 a90,10 0 0 1 -180,0 v-46 a90,10 0 0 1 180,0" fill="#ebf8f7" stroke="#80d4cc" stroke-width="1.3"/><ellipse cx="750" cy="256" rx="90" ry="10" fill="#dbf3f1" stroke="#80d4cc"/><text x="750" y="286" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#26b6a9" text-anchor="middle">rule_globex</text><path d="M590,147 L654,278" fill="none" stroke="#00a99a" stroke-width="1.6" marker-end="url(#arrt)"/><rect x="60" y="352" width="820" height="54" rx="11" fill="#f5f6f7" stroke="#acb5bd" stroke-width="1.2" filter="url(#sh)"/><rect x="60" y="352" width="4.5" height="54" rx="2" fill="#5a6b7b"/><text x="76" y="376" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1c2530" text-anchor="start">隔离与备库</text><text x="76" y="395" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.3" font-weight="400" fill="#5a6b7b" text-anchor="start">按租户选 db_id + 懒建库建表（ensure_current_ready）；引擎无长驻运行态，比流程 S2 更简单——只需选库 + 懒备</text></svg>